name: CI/CD Be Facemenow

on:
  push:
    branches:
      - main

env:
  DOCKER_IMAGE: ${{ secrets.DOCKER_IMAGE }}
  DEPLOY_SERVER: ${{ secrets.DEPLOY_SERVER }}
  DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

jobs:
  build_and_push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: docker build -t $DOCKER_IMAGE .

      - name: Push Docker image to Docker Hub
        run: docker push $DOCKER_IMAGE

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build_and_push

    steps:
      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Deploy Server
        env:
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          BUCKKET_NAME: ${{ secrets.BUCKKET_NAME }}
          MINIO_SSL: ${{ secrets.MINIO_SSL }}
          MINIO_PUBLIC_URL: ${{ secrets.MINIO_PUBLIC_URL }}
          # --- SaaS platform (app.main) ---
          REDIS_URL: ${{ secrets.REDIS_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
          ADMIN_JWT_SECRET: ${{ secrets.ADMIN_JWT_SECRET }}
          ADMIN_BOOTSTRAP_USERNAME: ${{ secrets.ADMIN_BOOTSTRAP_USERNAME }}
          ADMIN_BOOTSTRAP_PASSWORD: ${{ secrets.ADMIN_BOOTSTRAP_PASSWORD }}
          STORAGE_BACKEND: ${{ secrets.STORAGE_BACKEND }}
          STORAGE_BUCKET: ${{ secrets.STORAGE_BUCKET }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
          FACE_SIMILARITY_THRESHOLD: ${{ secrets.FACE_SIMILARITY_THRESHOLD }}
          LEGACY_API_ENABLED: ${{ secrets.LEGACY_API_ENABLED }}
        run: |
          export SSHPASS=$DEPLOY_PASSWORD
          sshpass -e ssh -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_SERVER "
            docker pull \"$DOCKER_IMAGE\"

            if [ \"\$(docker ps -q -f name=be-facemenow)\" ]; then docker stop be-facemenow; fi
            if [ \"\$(docker ps -aq -f name=be-facemenow)\" ]; then docker rm be-facemenow; fi

            docker run -d -p 7777:8000 \
              --env DATABASE_URL=${DATABASE_URL} \
              --env MINIO_ENDPOINT=${MINIO_ENDPOINT} \
              --env MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY} \
              --env MINIO_SECRET_KEY=${MINIO_SECRET_KEY} \
              --env MINIO_SSL=${MINIO_SSL} \
              --env MINIO_PUBLIC_URL=${MINIO_PUBLIC_URL} \
              --env BUCKKET_NAME=${BUCKKET_NAME} \
              --env STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY} \
              --env STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET} \
              --env APP_ENV=production \
              --env REDIS_URL=${REDIS_URL} \
              --env SUPABASE_URL=${SUPABASE_URL} \
              --env SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY} \
              --env SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY} \
              --env SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET} \
              --env ADMIN_JWT_SECRET=${ADMIN_JWT_SECRET} \
              --env ADMIN_BOOTSTRAP_USERNAME=${ADMIN_BOOTSTRAP_USERNAME} \
              --env ADMIN_BOOTSTRAP_PASSWORD=${ADMIN_BOOTSTRAP_PASSWORD} \
              --env STORAGE_BACKEND=${STORAGE_BACKEND:-minio} \
              --env STORAGE_BUCKET=${STORAGE_BUCKET:-faces} \
              --env CORS_ORIGINS=${CORS_ORIGINS:-*} \
              --env FACE_SIMILARITY_THRESHOLD=${FACE_SIMILARITY_THRESHOLD:-0.45} \
              --env LEGACY_API_ENABLED=${LEGACY_API_ENABLED:-false} \
              --restart unless-stopped \
              --name be-facemenow \"$DOCKER_IMAGE\"
          "
