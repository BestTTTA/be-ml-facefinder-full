name: CI/CD Be Facemenow

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # A broken commit must never reach the server, so the deploy waits on the suite.
  test:
    name: Lint, type-check, test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: facefinder
          POSTGRES_PASSWORD: facefinder
          POSTGRES_DB: facefinder_test
        ports: ["5555:5432"]
        options: >-
          --health-cmd "pg_isready -U facefinder" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (no face model needed — tests use FACE_ENGINE=fake)
        run: |
          python -m pip install --upgrade pip
          pip install "fastapi>=0.115" "uvicorn[standard]" "sqlalchemy[asyncio]>=2.0" asyncpg alembic \
            pgvector "redis>=5" "pyjwt[crypto]" httpx argon2-cffi python-multipart pydantic-settings pillow numpy minio \
            pytest pytest-asyncio fakeredis ruff mypy
      - run: ruff check app tests migrations/env.py
      - run: mypy -p app
      - run: pytest -q
        env:
          TEST_DATABASE_URL: postgresql://facefinder:facefinder@localhost:5555/facefinder_test

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: test
    # The image is built on the server: it is arm64, these runners are amd64, and
    # building on the target also avoids pushing ~3GB through a registry.
    steps:
      # The host has no public inbound address — it is only reachable over the
      # tailnet, so the runner joins it first.
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      # Separates "cannot reach the host" from "cannot log in", which the ssh
      # step alone cannot tell apart.
      - name: Probe connectivity
        env:
          DEPLOY_SERVER: ${{ secrets.DEPLOY_SERVER }}
        run: |
          if [ -z "${DEPLOY_SERVER:-}" ]; then
            echo "::error::the DEPLOY_SERVER secret is empty"
            exit 1
          fi
          echo "target: $DEPLOY_SERVER"
          tailscale status || true
          tailscale ping -c 3 "$DEPLOY_SERVER" || true
          # bash's /dev/tcp avoids depending on nc being present on the runner.
          for _ in $(seq 1 15); do
            if (exec 3<>"/dev/tcp/$DEPLOY_SERVER/22") 2>/dev/null; then
              echo "port 22 is reachable"
              exit 0
            fi
            sleep 2
          done
          echo "::error::$DEPLOY_SERVER:22 is unreachable from the runner — check the tailnet ACL and the DEPLOY_SERVER value"
          exit 1

      - name: Build and swap on the server
        env:
          DEPLOY_SERVER: ${{ secrets.DEPLOY_SERVER }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -eu
          export SSHPASS="$DEPLOY_PASSWORD"
          path="${DEPLOY_PATH:-\$HOME/Project/Facefinderr/repo}"

          # Everything the deploy needs lives in the repo and in the server's .env,
          # so no application secret has to travel through Actions.
          # A runner carries its own SSH keys, and offering them first can exhaust
          # the server's MaxAuthTries before the password is ever tried, so the
          # password method is the only one left enabled here.
          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30"
          SSH_OPTS="$SSH_OPTS -o PreferredAuthentications=password -o PubkeyAuthentication=no"
          SSH_OPTS="$SSH_OPTS -o IdentitiesOnly=yes -o NumberOfPasswordPrompts=1"

          sshpass -e ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_SERVER" sh -s <<REMOTE
          set -e
          cd "$path"
          git fetch --prune origin
          git checkout --detach "$GITHUB_SHA"
          chmod +x docker/deploy.sh
          ./docker/deploy.sh "$(echo "$GITHUB_SHA" | cut -c1-7)"
          REMOTE

      - name: Report running version
        if: always()
        env:
          DEPLOY_SERVER: ${{ secrets.DEPLOY_SERVER }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
        run: |
          export SSHPASS="$DEPLOY_PASSWORD"
          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30"
          SSH_OPTS="$SSH_OPTS -o PreferredAuthentications=password -o PubkeyAuthentication=no"
          SSH_OPTS="$SSH_OPTS -o IdentitiesOnly=yes -o NumberOfPasswordPrompts=1"
          sshpass -e ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_SERVER" \
            'docker inspect -f "image={{.Config.Image}} status={{.State.Status}}" be-facemenow 2>/dev/null || echo "container not running"'
