name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint, type-check, test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: facefinder
          POSTGRES_PASSWORD: facefinder
          POSTGRES_DB: facefinder_test
        ports: ["5555:5432"]
        options: >-
          --health-cmd "pg_isready -U facefinder" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (no face model needed — tests use FACE_ENGINE=fake)
        run: |
          python -m pip install --upgrade pip
          pip install "fastapi>=0.115" "uvicorn[standard]" "sqlalchemy[asyncio]>=2.0" asyncpg alembic \
            pgvector "redis>=5" "pyjwt[crypto]" httpx argon2-cffi python-multipart pydantic-settings pillow numpy minio \
            pytest pytest-asyncio fakeredis ruff mypy
      - run: ruff check app tests migrations/env.py
      - run: mypy -p app
      - run: alembic upgrade head && alembic check
        env:
          DATABASE_URL: postgresql://facefinder:facefinder@localhost:5555/facefinder
      - run: pytest -q
        env:
          TEST_DATABASE_URL: postgresql://facefinder:facefinder@localhost:5555/facefinder_test

  docker:
    name: Build image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: facefinder-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
